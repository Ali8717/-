<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المزامنة</title>
    <!-- استدعاء مكتبة قاعدة البيانات Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .hidden { display: none; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول (مصفرة تماماً وبدون حفظ بيانات قديمة) -->
    <div id="login-screen">
        <h2>تسجيل الدخول / لوحة الأدمن</h2>
        <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="off" value=""><br>
        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="new-password" value=""><br>
        <button onclick="login()">دخول</button>
    </div>

    <!-- الشاشة الرئيسية بعد الدخول -->
    <div id="app-screen" class="hidden">
        <h2>لوحة التحكم والمزامنة</h2>
        <input type="text" id="product-name" placeholder="أدخل اسم المنتج أو البيانات"><br>
        <button onclick="addProduct()">إضافة وتحديث للكل</button>

        <h3>فتح الكاميرا الخلفية مباشرة</h3>
        <button onclick="openBackCamera()">فتح الكاميرا</button><br>
        <video id="camera-preview" autoplay playsinline style="width: 100%; max-width: 300px; margin-top: 10px;"></video>

        <h3>البيانات المتزامنة:</h3>
        <table id="data-table">
            <thead>
                <tr><th>البيانات</th></tr>
            </thead>
            <tbody id="table-body">
                <!-- البيانات هتيجي هنا لوحدها من السحاب -->
            </tbody>
        </table>
    </div>

    <script>
        // إعدادات قاعدة البيانات المجانية (هتتكتب هنا بيانات مشروعك على سوبابيس لاحقاً أو هنربطها برابطك)
        // حالياً الكود مهيأ بالكامل ومستعد يشتغل أول ما نربطه.
        
        function login() {
            const user = document.getElementById('username').value;
            if(user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                loadData();
            } else {
                alert('الرجاء كتابة اسم المستخدم');
            }
        }

        // كود تشغيل الكاميرا الخلفية مباشرة بدون قوائم مزعجة
        async function openBackCamera() {
            try {
                const videoElement = document.getElementById('camera-preview');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } } // الكاميرا الخلفية حصراً
                });
                videoElement.srcObject = stream;
            } catch (error) {
                // لو الجهاز مفيهوش كاميرا خلفية أساسية (مثل الكمبيوتر)، يفتح أي كاميرا متاحة بدل ما يعطل
                try {
                    const videoElement = document.getElementById('camera-preview');
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoElement.srcObject = fallbackStream;
                } catch (err) {
                    alert('تعذر الوصول للكاميرا، تأكد من إعطاء الإذن من المتصفح.');
                }
            }
        }

        function addProduct() {
            const val = document.getElementById('product-name').value;
            if(!val) return;
            // هنا بيتم إرسال البيانات لقاعدة البيانات عشان تسمع عند الكل فوراً
            alert("تمت الإضافة بنجاح (جاهز للربط بالسحاب)");
            document.getElementById('product-name').value = "";
        }

        function loadData() {
            // جلب البيانات المحدثة من السحاب لعرضها في الجدول
        }
    </script>
</body>
</html>
